[project]
name = "backtalk"
version = "1.0.0"
description = "Talk to your Codex agent out loud. Hold a key, speak, and it answers in a real voice."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.0",
    # Apple Silicon only: runs the SAME whisper model on the GPU.
    # CTranslate2 (under faster-whisper) has no Metal backend, so
    # without this every Mac transcribes on the CPU. Measured 0.88s
    # -> 0.12s on an M4 Max with an identical transcript. Every other
    # platform keeps faster-whisper, which already uses CUDA.
    "mlx-whisper>=0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # NumPy 2.5.3 hangs PortAudio playback on tested Windows/Realtek USB
    # audio while 2.5.2 completes normally. Keep Windows on the verified
    # release; other platforms retain the existing flexible requirement.
    "numpy>=1.26.0,<2.5 ; sys_platform == 'win32' and python_version < '3.12'",
    "numpy==2.5.2 ; sys_platform == 'win32' and python_version >= '3.12'",
    "numpy>=1.26.0 ; sys_platform != 'win32'",
    "pynput>=1.8.0",
    "setuptools<81",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    # Use the Windows certificate store for first-run model downloads.
    "truststore>=0.10.0 ; sys_platform == 'win32'",
    # Windows has no compiler by default and upstream webrtcvad ships an
    # sdist ONLY -- no wheels for any platform -- so uv tries to build it
    # and dies demanding Visual C++ Build Tools. webrtcvad-wheels is the
    # same code with binary wheels, importing as the identical module.
    "webrtcvad>=2.0.10 ; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10 ; sys_platform == 'win32'",
]

[tool.setuptools]
packages = ["backtalk"]

[tool.uv]
package = false
